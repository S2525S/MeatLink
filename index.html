<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeatLink</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f7f6;
      color: #18352d;
    }

    header {
      background: #176b52;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border-radius: 10px;
      background: #176b52;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
    }

    .button.secondary {
      background: #d97918;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #60736d;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>MeatLink</h1>
    <p>食肉卸業務・受注管理システム</p>
  </header>

  <main>
    <section class="card">
      <h2>MeatLink Order</h2>
      <p>商品を選択して発注する注文画面です。</p>
      <a class="button" href="./order/">注文画面を開く</a>
    </section>

    <section class="card">
      <h2>MeatLink AI</h2>
      <p>FAX画像・PDF・文章から注文内容を取り込みます。</p>
      <a class="button secondary" href="./ai/">AI受注画面を開く</a>
    </section>
  </main>

  <footer>
    MeatLink v1.0
  </footer>
</body>
</html>
