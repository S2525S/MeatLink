<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MeatLink Order</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f6f5;
      color: #17372e;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      color: #fff;
      background: #176b52;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    .card {
      padding: 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .08);
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #176b52;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 18px;
      color: #176b52;
      text-align: center;
    }

    .note {
      margin-top: 18px;
      color: #65756f;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>MeatLink Order</h1>
    <p>LINE発注・注文受付</p>
  </header>

  <main>
    <section class="card">
      <h2>注文を開始</h2>
      <p>商品選択、数量入力、注文送信を行います。</p>

      <a
        class="button"
        href="https://s2525s.github.io/meatflow-liff/"
      >
        注文画面を開く
      </a>

      <p class="note">
        現在稼働している注文システムを、MeatLink Orderから利用します。
      </p>

      <a class="back" href="../">MeatLinkトップへ戻る</a>
    </section>
  </main>
</body>
</html>
